openapi: 3.0.3
info:
  title: Flash Sale Engine API
  version: 1.0.0
  description: Generated from the supplied Postman collection. It documents the Products
    and Flash Sales endpoints present in the export.
servers:
- url: http://localhost
  description: Local environment default
- url: http://0.0.0.0:8000
  description: Collection default
tags:
- name: Products
- name: Flash Sales
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Product:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Aurora Smartphone X1
        slug:
          type: string
          example: aurora-smartphone-x1
        description:
          type: string
          example: Smartphone
        base_price:
          type: number
          format: float
          example: 49.99
        currency:
          type: string
          example: USD
        sku:
          type: string
          example: AURORA-X1
        is_active:
          type: boolean
          example: true
        inventory:
          type: integer
          example: 100
    FlashSaleItem:
      type: object
      properties:
        id:
          type: integer
          example: 1
        product_id:
          type: integer
          example: 1
        sale_price:
          type: number
          format: float
          example: 19.99
        quantity_limit:
          type: integer
          example: 20
        product:
          $ref: '#/components/schemas/Product'
    FlashSale:
      type: object
      properties:
        id:
          type: integer
          example: 1
        title:
          type: string
          example: Postman Flash Sale
        description:
          type: string
          example: Created via automated test
        starts_at:
          type: string
          format: date-time
          example: '2020-01-01T00:00:00Z'
        ends_at:
          type: string
          format: date-time
          example: '2099-01-01T00:00:00Z'
        status:
          type: string
          example: active
        items:
          type: array
          items:
            $ref: '#/components/schemas/FlashSaleItem'
        items_count:
          type: integer
          example: 1
    PurchaseAccepted:
      type: object
      required:
      - reference_id
      - status_url
      properties:
        reference_id:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000001
        status_url:
          type: string
          example: /flash-sales/purchases/00000000-0000-0000-0000-000000000001/status
    PurchaseStatus:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - pending
          - processing
          - completed
          - failed
          example: pending
        reference_id:
          type: string
          format: uuid
          nullable: true
        order_id:
          type: integer
          nullable: true
        order_number:
          type: string
          nullable: true
    ValidationError:
      type: object
      properties:
        errors:
          type: object
          additionalProperties: true
    ErrorResponse:
      type: object
      properties:
        message:
          type: string
        errors:
          type: object
          additionalProperties: true
paths:
  /products:
    get:
      summary: List products
      operationId: listProducts
      tags:
      - Products
      parameters:
      - name: min_price
        in: query
        schema:
          type: number
          format: float
      - name: max_price
        in: query
        schema:
          type: number
          format: float
      - name: category
        in: query
        schema:
          type: string
          example: electronics
      - name: sort
        in: query
        schema:
          type: string
          example: price_asc
      - name: per_page
        in: query
        schema:
          type: integer
          maximum: 100
          example: 100
      responses:
        '200':
          description: Paginated products
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Product'
                  per_page:
                    type: integer
              example:
                data:
                - &id001
                  id: 1
                  name: Aurora Smartphone X1
                  slug: aurora-smartphone-x1
                  description: Smartphone
                  base_price: 49.99
                  currency: USD
                  sku: AURORA-X1
                  is_active: true
                  inventory: 100
                per_page: 15
      description: The collection tests default listing, price-range filtering with
        ascending sort, invalid category (404), and per_page clamping at 100.
    post:
      summary: Create product
      operationId: createProduct
      tags:
      - Products
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example:
              name: Test Widget 123
              description: A widget created via Postman test
              base_price: 49.99
              currency: USD
              sku: WIDGET-123
              is_active: true
              quantity_available: 100
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
              example: *id001
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
      security:
      - bearerAuth: []
      description: The collection tests successful admin creation plus missing required
        fields (422), customer-forbidden (403), and unauthenticated (401).
  /products/{idOrSlug}:
    get:
      summary: Get product by ID or slug
      operationId: getProduct
      tags:
      - Products
      parameters: &id002
      - &id003
        name: idOrSlug
        in: path
        required: true
        schema:
          type: string
          example: '1'
      responses:
        '200':
          description: Product
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
              example: *id001
        '404':
          description: Not found
    patch:
      summary: Update product
      operationId: updateProduct
      tags:
      - Products
      parameters: *id002
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example:
              base_price: 39.99
              is_active: true
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
              example:
                id: 1
                name: Aurora Smartphone X1
                slug: aurora-smartphone-x1
                description: Smartphone
                base_price: 39.99
                currency: USD
                sku: AURORA-X1
                is_active: true
                inventory: 100
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden
        '404':
          description: Not found
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
      security:
      - bearerAuth: []
    delete:
      summary: Delete product
      operationId: deleteProduct
      tags:
      - Products
      parameters:
      - *id003
      - name: force
        in: query
        schema:
          type: boolean
          example: true
      responses:
        '200':
          description: Deleted
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden
        '404':
          description: Not found
      security:
      - bearerAuth: []
  /flash-sales:
    get:
      summary: List flash sales
      operationId: listFlashSales
      tags:
      - Flash Sales
      parameters:
      - name: status
        in: query
        schema:
          type: string
          example: active
      responses:
        '200':
          description: Flash sales
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/FlashSale'
              example:
                data:
                - &id004
                  id: 1
                  title: Postman Flash Sale
                  description: Created via automated test
                  starts_at: '2020-01-01T00:00:00Z'
                  ends_at: '2099-01-01T00:00:00Z'
                  status: active
                  items: &id006
                  - &id007
                    id: 1
                    product_id: 1
                    sale_price: 19.99
                    quantity_limit: 20
                    product: *id001
                  items_count: 1
    post:
      summary: Create flash sale
      operationId: createFlashSale
      tags:
      - Flash Sales
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example:
              title: Postman Flash Sale
              description: Created via automated test
              starts_at: '2020-01-01T00:00:00Z'
              ends_at: '2099-01-01T00:00:00Z'
              status: active
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlashSale'
              example: *id004
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
      security:
      - bearerAuth: []
      description: The collection tests successful creation plus end-before-start
        (422) and duplicate product entries (422).
  /flash-sales/{flashSaleId}:
    get:
      summary: Get flash sale by ID
      operationId: getFlashSale
      tags:
      - Flash Sales
      parameters: &id005
      - &id008
        name: flashSaleId
        in: path
        required: true
        schema:
          type: integer
          example: 1
      responses:
        '200':
          description: Flash sale
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlashSale'
              example: *id004
        '404':
          description: Not found
    patch:
      summary: Update flash sale
      operationId: updateFlashSale
      tags:
      - Flash Sales
      parameters: *id005
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example:
              title: Postman Flash Sale (Updated)
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlashSale'
              example:
                id: 1
                title: Postman Flash Sale (Updated)
                description: Created via automated test
                starts_at: '2020-01-01T00:00:00Z'
                ends_at: '2099-01-01T00:00:00Z'
                status: active
                items: *id006
                items_count: 1
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden
        '404':
          description: Not found
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
      security:
      - bearerAuth: []
      description: The collection tests title update (200) and a timing change while
        active (422).
    delete:
      summary: Delete flash sale
      operationId: deleteFlashSale
      tags:
      - Flash Sales
      parameters: *id005
      responses:
        '200':
          description: Deleted
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden
        '404':
          description: Not found
      security:
      - bearerAuth: []
  /flash-sales/{flashSaleId}/items:
    post:
      summary: Add item to flash sale
      operationId: addFlashSaleItem
      tags:
      - Flash Sales
      parameters: *id005
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example:
              product_id: 1
              sale_price: 19.99
              quantity_limit: 20
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlashSaleItem'
              example: *id007
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
      security:
      - bearerAuth: []
      description: The collection tests successful admin creation, duplicate product
        (422), and customer-forbidden (403).
  /flash-sales/{flashSaleId}/items/{flashSaleItemId}:
    delete:
      summary: Remove flash sale item
      operationId: removeFlashSaleItem
      tags:
      - Flash Sales
      parameters:
      - *id008
      - name: flashSaleItemId
        in: path
        required: true
        schema:
          type: integer
          example: 1
      responses:
        '204':
          description: Removed
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden
        '404':
          description: Not found
      security:
      - bearerAuth: []
  /flash-sales/{flashSaleId}/purchase:
    post:
      summary: Purchase flash sale item
      operationId: purchaseFlashSale
      tags:
      - Flash Sales
      parameters: *id005
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example:
              product_id: 1
              quantity: 1
              shipping_address_id: 1
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseAccepted'
              example:
                reference_id: 00000000-0000-0000-0000-000000000001
                status_url: /flash-sales/purchases/00000000-0000-0000-0000-000000000001/status
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden
        '404':
          description: Not found
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
      security:
      - bearerAuth: []
      description: The collection tests accepted purchases (202), quantity over max
        (422), product not in sale (422), unauthenticated (401), and nonexistent sale
        (404 in the current test).
  /flash-sales/purchases/{purchaseReference}/status:
    get:
      summary: Check purchase status
      operationId: checkPurchaseStatus
      tags:
      - Flash Sales
      parameters:
      - name: purchaseReference
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseStatus'
              example:
                status: pending
                reference_id: 00000000-0000-0000-0000-000000000001
        '404':
          description: Unknown reference
