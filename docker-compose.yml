version: '3.8'

services:
  # Laravel Application
  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: flash-sale-app
    restart: unless-stopped
    working_dir: /app
    command: [ "php-fpm", "-F" ]
    environment:
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=flash_sale
      - DB_USERNAME=root
      - DB_PASSWORD=@123123asdasdF
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - ./app:/app
      - ./app/storage:/app/storage
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "php-fpm -t > /dev/null 2>&1 || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - backend

  # Laravel Horizon — Redis queue supervisor + dashboard.
  # Runs the same image as `app` but as a long-lived worker process instead
  # of php-fpm. Replaces the (previously nonexistent) queue worker: before
  # this, nothing in docker-compose actually processed the `redis` queue.
  horizon:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: flash-sale-horizon
    restart: unless-stopped
    working_dir: /app
    command: [ "php", "artisan", "horizon" ]
    environment:
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=flash_sale
      - DB_USERNAME=root
      - DB_PASSWORD=@123123asdasdF
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - ./app:/app
      - ./app/storage:/app/storage
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "pgrep -f 'artisan horizon' > /dev/null || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - backend

  # Laravel scheduler — runs `schedule:run` every minute inside the
  # container so `horizon:snapshot` (config/horizon.php metrics) fires
  # without needing a host crontab.
  scheduler:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: flash-sale-scheduler
    restart: unless-stopped
    working_dir: /app
    command: [ "php", "artisan", "schedule:work" ]
    environment:
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=flash_sale
      - DB_USERNAME=root
      - DB_PASSWORD=@123123asdasdF
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - ./app:/app
      - ./app/storage:/app/storage
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend

  # Laravel Reverb — WebSocket server for live flash-sale stock updates.
  reverb:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: flash-sale-reverb
    restart: unless-stopped
    working_dir: /app
    command: [ "php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080" ]
    environment:
      - APP_ENV=local
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=flash_sale
      - DB_USERNAME=root
      - DB_PASSWORD=@123123asdasdF
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REVERB_SERVER_HOST=0.0.0.0
      - REVERB_SERVER_PORT=8080
      - REVERB_HOST=reverb
      - REVERB_PORT=8080
      - REVERB_SCHEME=http
      - REVERB_APP_ID=flash-sale-local
      - REVERB_APP_KEY=flash-sale-key
      - REVERB_APP_SECRET=flash-sale-secret
      - REVERB_ALLOWED_ORIGINS=*
    volumes:
      - ./app:/app
      - ./app/storage:/app/storage
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "pgrep -f 'artisan reverb:start' > /dev/null || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - backend

  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: flash-sale-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: flash_sale
      MYSQL_ROOT_PASSWORD: "@123123asdasdF"
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - backend
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p@123123asdasdF" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache & Queue
  redis:
    image: redis:7-alpine
    container_name: flash-sale-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - backend
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: flash-sale-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./app/public:/app/public:ro
    depends_on:
      app:
        condition: service_healthy
      reverb:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget -q --spider http://127.0.0.1/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

volumes:
  mysql_data:
  redis_data:

networks:
  backend:
    driver: bridge
